## Settings file was created by plugin StarTruckMP v1.2.4
## Plugin GUID: StarTruckMP.Client

[Connection]

## StarTruckMP server address
# Setting type: String
# Default value: 127.0.0.1
ServerAddress = 127.0.0.1

## StarTruckMP server port
# Setting type: String
# Default value: 7777
ServerPort = 7777

## Accept the server's self-signed certificate. Every StarTruckMP server generates one on first start, so this stays on unless the host installed a real certificate.
# Setting type: Boolean
# Default value: true
IgnoreSslValidation = true

[Audio]

## Exact microphone device name to use. Leave empty to auto-select.
# Setting type: String
# Default value:
MicrophoneDeviceName =

## When auto-selecting, try the Windows default microphone before explicit devices.
# Setting type: Boolean
# Default value: true
PreferSystemDefaultMicrophone = true

## Final output gain applied after the NWaves radio voice effect.
# Setting type: Single
# Default value: 1
RadioEffectOutputGain = 1

## Run the microphone through RNNoise before sending. Turn off if your headset already suppresses noise and voices come out muffled.
# Setting type: Boolean
# Default value: true
NoiseSuppression = true

## Microphone volume multiplier, 1.0 = as captured. Check it with the microphone test on the multiplayer page.
# Setting type: Single
# Default value: 1
MicrophoneGain = 1

## How loud other players come out of the CB radio, 1.0 = as received.
# Setting type: Single
# Default value: 1
RadioVolume = 1

## Mute other players while the game's own radio conversation is running, so an NPC call is not talked over. Your talk button never transmits during one either way.
# Setting type: Boolean
# Default value: true
MuteRadioDuringDialogue = true

## How much other players' voices are coloured like a CB radio: 0 = clean voice, 1 = band and compression only, 2 = the full set with a driven, clipping input stage and squelch clicks.
# Setting type: Int32
# Default value: 2
RadioEffect = 2

[Multiplayer]

## Show other players' names above their trucks.
# Setting type: Boolean
# Default value: true
ShowNameplates = true

## Let other players' trucks collide with you. Off by default: with any latency the collision happens where the truck is not.
# Setting type: Boolean
# Default value: false
RemoteCollisions = false

## Fade other players' trucks out when they are in the way at a warp gate or a docking bay. Your own truck is never touched.
# Setting type: Boolean
# Default value: true
GhostMode = true

## The key that opens the chat line on the cab monitor. Rebindable from the multiplayer page; keep it off the game's own bindings.
# Setting type: KeyCode
# Default value: Return
ChatKey = Return
