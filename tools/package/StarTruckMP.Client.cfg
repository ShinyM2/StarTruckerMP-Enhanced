## Settings file was created by plugin StarTruckMP v1.1.0
## Plugin GUID: StarTruckMP.Client

[Connection]

## StarTruckMP server address
# Setting type: String
# Default value: 127.0.0.1
ServerAddress = 127.0.0.1

## StarTruckMP server port
# Setting type: String
# Default value: 7777
ServerPort = 7777

## Accept the server's self-signed certificate. Every StarTruckMP server generates one on first start, so this stays on unless the host installed a real certificate.
# Setting type: Boolean
# Default value: true
IgnoreSslValidation = true

[Multiplayer]

## Show other players' names above their trucks.
# Setting type: Boolean
# Default value: true
ShowNameplates = true

## Let other players' trucks collide with you. Off by default: with any latency the collision happens where the truck is not.
# Setting type: Boolean
# Default value: false
RemoteCollisions = false

## Fade other players' trucks out when they are in the way at a warp gate or a docking bay. Your own truck is never touched.
# Setting type: Boolean
# Default value: true
GhostMode = true

## The key that opens the chat line on the cab monitor. Rebindable from the multiplayer page; keep it off the game's own bindings.
# Setting type: KeyCode
# Default value: Return
ChatKey = Return
